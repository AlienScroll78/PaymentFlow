apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      initContainers:
        - name: migrate
          image: stellaredupay/backend:canary
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
      containers:
        - name: backend
          image: stellaredupay/backend:canary
          # Canary pods use the dedicated /health/ready probe which only passes
          # once migrations have run and all dependencies are reachable.
          # This ensures canary traffic is only served after a healthy startup.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
