apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Allow Next.js server to finish serving in-flight requests before SIGKILL.
      # Next.js graceful shutdown is typically fast, but allow 45 s to be safe.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # imagePullSecrets is used for private registries.
      # Reference it in your Kustomize overlay:
      #   imagePullSecrets:
      #     - name: regcred
      containers:
        - name: frontend
          image: stellaredupay/frontend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_PROXY_TARGET
              valueFrom:
                configMapKeyRef:
                  name: stellaredupay
                  key: BACKEND_PROXY_TARGET

          # ── startupProbe ────────────────────────────────────────────────────
          # Next.js page compilation can be slow on first request.
          # Give it up to 90 s (18 × 5 s) before liveness takes over.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18   # 18 × 5 s = 90 s max startup budget

          # ── livenessProbe ───────────────────────────────────────────────────
          # Restarts the pod if the Next.js server stops responding entirely.
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── readinessProbe ──────────────────────────────────────────────────
          # Removes the pod from the Service endpoints if it cannot serve a
          # basic page request, preventing traffic from reaching a warming pod.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # See docs/k8s-resource-sizing.md for sizing rationale.
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
