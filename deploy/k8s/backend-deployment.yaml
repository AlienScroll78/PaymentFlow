apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # imagePullSecrets is used for private registries.
      # Create the secret with:
      #   kubectl create secret docker-registry regcred \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # Then reference it in your Kustomize overlay:
      #   imagePullSecrets:
      #     - name: regcred
      initContainers:
        - name: migrate
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate"]
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: backend
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
            - name: REDIS_HOST
              value: "redis"
          # Readiness probe: routes traffic only when DB and Horizon are reachable.
          # Uses /health/ready which performs full dependency checks (DB, Stellar).
          # A failing readiness probe removes the pod from the load balancer without
          # restarting it — correct behaviour when upstream dependencies are down.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness probe: restarts the pod if the process is deadlocked or hung.
          # Uses /health/live which only checks process responsiveness (no I/O).
          # Higher initialDelaySeconds gives the app time to fully start up before
          # the kubelet starts evaluating liveness.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe: prevents liveness from killing a slow-starting pod.
          # Allows up to 60 s (6 checks × 10 s) for migrations + DB connect.
          # Once it succeeds once, the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
