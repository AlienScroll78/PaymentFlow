apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Allow 60 s for in-flight requests + queue drain on SIGTERM before
      # Kubernetes sends SIGKILL.  Must be > SHUTDOWN_TIMEOUT_MS (default 30 s)
      # so the app can drain gracefully.  Set conservatively at 75 s to leave a
      # margin for slow requests.
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # imagePullSecrets is used for private registries.
      # Create the secret with:
      #   kubectl create secret docker-registry regcred \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # Then reference it in your Kustomize overlay:
      #   imagePullSecrets:
      #     - name: regcred
      initContainers:
        - name: migrate
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate"]
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: backend
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
            - name: REDIS_HOST
              value: "redis"

          # ── startupProbe ────────────────────────────────────────────────────
          # Absorbs the Node.js cold-start + MongoDB connection establishment
          # before liveness probes kick in.  failureThreshold * periodSeconds
          # = 120 s maximum startup budget.  Once the app returns a non-5xx on
          # /health/live, the startupProbe succeeds and Kubernetes hands off to
          # the liveness and readiness probes below.
          startupProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24   # 24 × 5 s = 120 s max startup budget

          # ── livenessProbe ───────────────────────────────────────────────────
          # Checks only that the Node.js process is alive and responsive.
          # Uses /health/live which returns 200 as long as the process is
          # running, even when MongoDB or Redis is temporarily degraded.
          # A failure here triggers a pod restart — reserved for true hangs or
          # crashes, NOT for downstream dependency outages.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── readinessProbe ──────────────────────────────────────────────────
          # Checks all dependencies (MongoDB, Redis, Horizon) before allowing
          # traffic.  Uses /health/ready which returns 200 only when the app
          # considers itself fit for traffic.  A failure here removes the pod
          # from the Service endpoints — the pod is not restarted, giving the
          # dependency time to recover.  This prevents the load balancer from
          # routing payment requests to a pod whose upstream connections are not
          # ready.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # See docs/k8s-resource-sizing.md for sizing rationale.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
