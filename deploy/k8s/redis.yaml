apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Allow Redis to complete BGSAVE on shutdown before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

          # ── startupProbe ────────────────────────────────────────────────────
          # Redis starts quickly; 30 s (6 × 5 s) is more than enough.
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6   # 6 × 5 s = 30 s max startup budget

          # ── livenessProbe ───────────────────────────────────────────────────
          # Restarts the pod if the Redis process is no longer accepting
          # commands (e.g. deadlock or OOM kill).
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── readinessProbe ──────────────────────────────────────────────────
          # Removes the pod from the Service endpoints while Redis is loading
          # data or warming up so the backend does not route BullMQ jobs to a
          # node that cannot yet process them.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # See docs/k8s-resource-sizing.md for sizing rationale.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  # Name must match REDIS_HOST in the backend Deployment (and ConfigMap).
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
