apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  annotations:
    # Requires the metrics adapter that exposes queue_age_seconds for worker.
    autoscaling.paymentflow.dev/queue-metric: queue_age_seconds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: External
      external:
        metric:
          name: queue_age_seconds
          selector:
            matchLabels:
              queue: payment-processing
        target:
          type: Value
          value: "30"