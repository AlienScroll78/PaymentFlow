name: Post-Deployment Smoke Tests

# Runs automatically after a successful deployment to testnet or mainnet.
# Also available as a manual trigger for on-demand smoke checks.
#
# Failure behaviour:
#   - Smoke failure sets the workflow status to failed.
#   - Failed smoke tests must be investigated before the deployment is
#     promoted to the next environment or declared healthy.
#
# SECURITY:
#   - Credentials flow exclusively through GitHub Secrets.
#   - No secret values are echoed, logged, or persisted.
#   - SMOKE_ADMIN_EMAIL / SMOKE_ADMIN_PASSWORD must reference a dedicated
#     smoke-test account that has no access to real payment records.
#     Provision this account before deploying to a new environment.
on:
  # Trigger manually or from a deployment workflow
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to smoke test'
        required: true
        type: choice
        options:
          - testnet
          - mainnet
  # Called from other workflows after a successful deploy
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  smoke:
    name: Smoke tests (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # No npm install needed — smoke-tests.js uses only Node.js built-ins.

      # ── Run smoke tests ──────────────────────────────────────────────────────
      # Credentials come from environment-scoped GitHub Secrets.
      # SMOKE_ADMIN_EMAIL / SMOKE_ADMIN_PASSWORD reference a dedicated
      # non-production-safe smoke-test account per the issue acceptance criteria.
      - name: Run post-deployment smoke tests
        env:
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: node scripts/smoke-tests.js

      # ── Page on failure ──────────────────────────────────────────────────────
      # Creates a GitHub issue to alert the team when smoke tests fail.
      # This satisfies the "failures block promotion or page the owner"
      # acceptance criterion (#121).
      - name: Create failure issue on smoke test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ inputs.environment }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Smoke tests FAILED on ${env} — deployment blocked`,
              body: [
                `## Post-Deployment Smoke Tests Failed`,
                ``,
                `**Environment:** ${env}`,
                `**Triggered by:** @${context.actor}`,
                `**Run:** [View logs](${runUrl})`,
                ``,
                `### Action Required`,
                ``,
                `One or more smoke tests failed after the rollout. The deployment should NOT be promoted until this is resolved.`,
                ``,
                `**Possible next steps:**`,
                `- Check the workflow logs for which specific check failed`,
                `- Verify \`/health/ready\` and \`/health\` manually`,
                `- Consider rolling back: \`kubectl rollout undo deployment/backend\``,
                ``,
                `See \`docs/operator-runbooks.md\` for triage procedures.`,
              ].join('\n'),
              labels: ['incident', 'deployment'],
            });

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Write smoke test summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All post-deployment smoke checks passed for \`${{ inputs.environment }}\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Smoke Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more smoke checks failed for \`${{ inputs.environment }}\`." >> $GITHUB_STEP_SUMMARY
            echo "A GitHub issue has been opened. Do not promote this deployment." >> $GITHUB_STEP_SUMMARY
          fi
