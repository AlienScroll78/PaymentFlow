name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── install ──────────────────────────────────────────────────────────────────
# Installs all three package sets (root, backend, frontend) and populates the
# shared npm cache. Downstream jobs restore from that cache so they do not pay
# the full network cost again.
jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

# ── syntax-check ─────────────────────────────────────────────────────────────
  syntax-check:
    name: Syntax check (all JS/JSX)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run syntax check
        run: npm run check:syntax

# ── lint-backend ──────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint backend (ESLint)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run ESLint on backend src
        run: cd backend && npx eslint src/ --max-warnings=0

# ── lint-frontend ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint frontend (Next.js lint)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Next.js lint
        run: cd frontend && npm run lint

# ── test-backend ──────────────────────────────────────────────────────────────
# Backend unit tests require a single-node MongoDB replica set because the code
# uses multi-document transactions. The healthcheck initiates "rs0" and waits
# for the node to become PRIMARY before any test step runs — matching the
# pattern from ci.yml exactly.
  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: [install]
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      # Dummy secrets required by config validation at module load time.
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Single-node replica set ("rs0") — REQUIRED. Multi-document MongoDB
        # transactions (payment recording, fee batch apply, TransactionManager)
        # fail against a standalone mongod with "Transaction numbers are only
        # allowed on a replica set member or mongos". The healthcheck runs
        # rs.initiate() on the first probe; job steps only start once the
        # service reports healthy (initiated + PRIMARY).
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run backend unit tests
        run: cd backend && npm test

# ── build-frontend ────────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend (next build)
    runs-on: ubuntu-latest
    needs: [install]
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Next.js frontend
        run: cd frontend && npm run build

# ── ci-checks-gate ────────────────────────────────────────────────────────────
# Single fan-in job. Add this job name ("CI checks gate") as the sole required
# status check in branch protection for `main` so that one rule covers all
# jobs in this workflow.
  ci-checks-gate:
    name: CI checks gate
    runs-on: ubuntu-latest
    needs:
      - install
      - syntax-check
      - lint-backend
      - lint-frontend
      - test-backend
      - build-frontend
    steps:
      - name: All checks passed
        run: echo "All CI checks passed."
