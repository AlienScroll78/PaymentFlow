# Container image vulnerability scanning with Trivy.
#
# Runs on every PR that touches the Dockerfile or package.json files so that
# newly introduced CVEs block merge before reaching the registry. Also runs on
# a weekly schedule to catch newly published CVEs against images already in
# production.
#
# Behaviour:
#   - Builds the backend Docker image from source.
#   - Scans the image with Trivy for OS and dependency CVEs.
#   - Fails the build (exit-code 1) on any HIGH or CRITICAL CVE that has a
#     known fix available (--ignore-unfixed filters out CVEs with no fix).
#   - Uploads the full SARIF vulnerability report as a CI artifact and to
#     GitHub Code Scanning (Advanced Security) for visibility in the
#     Security tab.
#   - Weekly scheduled scan uses the same logic against the latest image
#     built from main.
#
# Issue #365 — Add container image vulnerability scanning to CI pipeline.

name: Container Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  schedule:
    # Weekly scan every Monday at 06:00 UTC to catch newly published CVEs.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Image reference to scan (leave blank to build from source)"
        required: false
        default: ""

env:
  BACKEND_IMAGE: stellaredupay/backend:scan
  FRONTEND_IMAGE: stellaredupay/frontend:scan

jobs:
  scan-backend:
    name: Scan backend image
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF to GitHub Code Scanning
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Build the image from source so the scan always reflects the current code.
      # On a scheduled run with no Dockerfile change the build is still needed
      # because the base image (node:20-alpine) may have received new CVE fixes.
      - name: Build backend Docker image
        run: docker build -t "$BACKEND_IMAGE" ./backend

      # Run Trivy with table output so humans can read it in the CI log.
      # --ignore-unfixed limits noise to actionable CVEs (ones with a fix).
      # --severity HIGH,CRITICAL limits failures to serious vulnerabilities.
      # --exit-code 1 fails the step (and therefore the PR) when violations found.
      - name: Run Trivy vulnerability scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Run a second pass to produce a SARIF report for GitHub Code Scanning.
      # exit-code 0 here so that a finding doesn't prevent artifact upload.
      - name: Run Trivy scan (SARIF output)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL,MEDIUM

      # Upload the SARIF to GitHub Security / Code Scanning dashboard.
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # Also upload as a downloadable CI artifact for local review.
      - name: Upload vulnerability report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend.sarif
          retention-days: 30

  scan-frontend:
    name: Scan frontend image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t "$FRONTEND_IMAGE" ./frontend

      - name: Run Trivy vulnerability scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Run Trivy scan (SARIF output)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL,MEDIUM

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload vulnerability report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend.sarif
          retention-days: 30

  # Alert gate — fails if either image scan found HIGH/CRITICAL fixable CVEs.
  # Used as the required status check for container-related PRs.
  scan-gate:
    name: Container scan gate
    runs-on: ubuntu-latest
    needs: [scan-backend, scan-frontend]
    if: always()
    steps:
      - name: Check scan results
        run: |
          backend_result="${{ needs.scan-backend.result }}"
          frontend_result="${{ needs.scan-frontend.result }}"
          if [ "$backend_result" = "failure" ] || [ "$frontend_result" = "failure" ]; then
            echo "::error::Container scan found HIGH or CRITICAL fixable CVEs. Review the Trivy reports in the artifacts and Security tab."
            exit 1
          fi
          echo "✓ No HIGH or CRITICAL fixable CVEs found in container images."
