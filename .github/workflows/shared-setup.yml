# Reusable workflow: Node.js environment setup with dependency caching.
#
# Callers invoke this with:
#
#   jobs:
#     my-job:
#       uses: ./.github/workflows/shared-setup.yml
#       with:
#         working-directory: backend   # optional; omit for root
#         cache-scope: backend         # used in the cache key prefix
#
# The workflow sets up the Node.js version declared in .nvmrc, restores
# node_modules from cache keyed on the relevant package-lock.json hash, and
# runs `npm ci` only on a cache miss. This reduces install time from ~60 s to
# ~5 s on warm caches.
#
# Issue #364 — Consolidate and harden CI workflows.

name: Shared Node.js Setup

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory in which to run npm ci (blank = repo root)"
        type: string
        required: false
        default: ""
      cache-scope:
        description: "Label included in the cache key to prevent cross-job collisions"
        type: string
        required: false
        default: "root"
      install-all:
        description: "When true, installs root + backend + frontend dependencies in one step"
        type: boolean
        required: false
        default: false

jobs:
  setup:
    name: "Node.js setup (${{ inputs.cache-scope }})"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Node.js version to the value declared in .nvmrc — single source of
      # truth for Node versions across the monorepo. No hard-coded version
      # strings in workflow files.
      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Cache strategy: key = OS + scope + hash of ALL package-lock.json files
      # so that any dependency change in any workspace invalidates the cache.
      # restore-keys provides a partial-hit fallback so we never start cold.
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-npm-${{ inputs.cache-scope }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.cache-scope }}-
            ${{ runner.os }}-npm-

      # Install dependencies. When install-all is true we install every
      # workspace in a single job (useful for test / coverage jobs). When a
      # specific working-directory is set we only install that package.
      - name: Install dependencies (all workspaces)
        if: inputs.install-all && steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          cd backend && npm ci && cd ..
          cd frontend && npm ci

      - name: Install dependencies (${{ inputs.working-directory || 'root' }})
        if: "!inputs.install-all && steps.cache.outputs.cache-hit != 'true'"
        working-directory: ${{ inputs.working-directory || '.' }}
        run: npm ci
