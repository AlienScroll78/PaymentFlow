# Secret Rotation Audit & Alert Workflow
#
# Runs on a schedule to:
#   1. Check whether any secret is past its rotation due date and alert.
#   2. Support manual rotation dispatch with audit logging.
#
# Rotation schedules (from docs/secret-rotation-schedule.md):
#   JWT_SECRET                  — 90  days
#   WEBHOOK_SECRET_ENCRYPTION_KEY — 90 days
#   SIGNER_MASTER_KEY           — 180 days
#   MONGO credentials           — 180 days
#   API keys / tokens           — 365 days
#
# Required GitHub Secrets (set under repo Settings → Secrets and variables → Actions):
#   SECRET_ROTATION_LAST_JWT          — ISO-8601 date of last JWT_SECRET rotation
#   SECRET_ROTATION_LAST_WEBHOOK_ENC  — ISO-8601 date of last WEBHOOK_SECRET_ENCRYPTION_KEY rotation
#   SECRET_ROTATION_LAST_SIGNER       — ISO-8601 date of last SIGNER_MASTER_KEY rotation
#   SECRET_ROTATION_LAST_MONGO        — ISO-8601 date of last MongoDB credential rotation
#
# Optional (for Slack alerting):
#   SLACK_WEBHOOK_URL — Slack incoming webhook URL for rotation-overdue alerts

name: Secret Rotation Audit

on:
  # Run daily at 08:00 UTC
  schedule:
    - cron: '0 8 * * *'

  # Allow manual trigger with optional rotation type selection
  workflow_dispatch:
    inputs:
      rotation_type:
        description: 'Secret type to rotate (for audit logging only — actual rotation is manual)'
        required: false
        default: 'audit-only'
        type: choice
        options:
          - audit-only
          - jwt-secret
          - webhook-encryption-key
          - signer-master-key
          - mongodb-credentials
      operator:
        description: 'Operator name (recorded in audit log)'
        required: false
        default: ''
      confirm:
        description: 'Type CONFIRM to acknowledge this rotation will invalidate live sessions (jwt-secret only)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Audit — check rotation due dates ─────────────────────────────────
  audit-rotation-schedule:
    name: Audit secret rotation schedule
    runs-on: ubuntu-latest
    outputs:
      overdue_secrets: ${{ steps.check.outputs.overdue_secrets }}
      any_overdue: ${{ steps.check.outputs.any_overdue }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Check rotation due dates
        id: check
        env:
          LAST_JWT_ROTATION: ${{ secrets.SECRET_ROTATION_LAST_JWT }}
          LAST_WEBHOOK_ENC_ROTATION: ${{ secrets.SECRET_ROTATION_LAST_WEBHOOK_ENC }}
          LAST_SIGNER_ROTATION: ${{ secrets.SECRET_ROTATION_LAST_SIGNER }}
          LAST_MONGO_ROTATION: ${{ secrets.SECRET_ROTATION_LAST_MONGO }}
        run: |
          node scripts/check-secret-rotation-schedule.js

      - name: Emit audit log entry
        run: |
          node -e "
            const entry = {
              timestamp: new Date().toISOString(),
              service: 'secret-rotation-audit',
              event: 'scheduled_audit',
              trigger: '${{ github.event_name }}',
              operator: '${{ github.actor }}',
              workflow_run_id: '${{ github.run_id }}',
              any_overdue: '${{ steps.check.outputs.any_overdue }}' === 'true',
              overdue_secrets: '${{ steps.check.outputs.overdue_secrets }}',
            };
            console.log(JSON.stringify(entry));
          "

      - name: Alert on overdue secrets (Slack)
        if: steps.check.outputs.any_overdue == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OVERDUE: ${{ steps.check.outputs.overdue_secrets }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \":rotating_light: *Secret rotation overdue* — the following secrets are past their rotation due date: \`${OVERDUE}\`. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> for details. Refer to \`docs/secret-rotation-schedule.md\` for rotation procedures.\",
              \"username\": \"PaymentFlow CI\",
              \"icon_emoji\": \":lock:\"
            }"

      - name: Fail if secrets are overdue
        if: steps.check.outputs.any_overdue == 'true'
        run: |
          echo "::error::One or more secrets are past their rotation due date: ${{ steps.check.outputs.overdue_secrets }}"
          echo "Refer to docs/secret-rotation-schedule.md for rotation procedures."
          exit 1

  # ── Job 2: Manual rotation audit log ────────────────────────────────────────
  # Fires only on workflow_dispatch with a non-audit-only rotation type.
  # The actual secret value is never passed through CI — the operator runs the
  # rotation script locally, then triggers this workflow to create the audit
  # trail entry for the rotation event.
  log-rotation-event:
    name: Log rotation event to audit trail
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rotation_type != 'audit-only'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Validate operator field
        run: |
          if [ -z "${{ github.event.inputs.operator }}" ]; then
            echo "::error::operator field is required for rotation logging. Re-run and provide your name."
            exit 1
          fi

      - name: Validate JWT confirmation
        if: github.event.inputs.rotation_type == 'jwt-secret'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "::error::JWT_SECRET rotation invalidates all live sessions. Type CONFIRM in the 'confirm' input to proceed."
            exit 1
          fi

      - name: Emit rotation audit log entry
        run: |
          node -e "
            const entry = {
              timestamp: new Date().toISOString(),
              service: 'secret-rotation',
              event: 'rotation_logged',
              secret_name: '${{ github.event.inputs.rotation_type }}',
              operator: '${{ github.event.inputs.operator }}',
              github_actor: '${{ github.actor }}',
              workflow_run_id: '${{ github.run_id }}',
              repository: '${{ github.repository }}',
              note: 'Secret value not included. Rotation performed locally by operator using scripts/rotate-*.js',
            };
            console.log(JSON.stringify(entry));
            console.log('');
            console.log('AUDIT: Rotation event logged for secret:', entry.secret_name);
            console.log('AUDIT: Operator:', entry.operator);
            console.log('AUDIT: Timestamp:', entry.timestamp);
            console.log('AUDIT: Run ID:', entry.workflow_run_id);
          "

      - name: Post-rotation reminder
        run: |
          echo ""
          echo "=========================================="
          echo "  Post-rotation checklist"
          echo "=========================================="
          echo ""
          echo "  secret: ${{ github.event.inputs.rotation_type }}"
          echo "  operator: ${{ github.event.inputs.operator }}"
          echo ""
          echo "  1. Verify /health is green on all pods after rolling restart."
          echo "  2. Update the SECRET_ROTATION_LAST_* GitHub Secret with today's date."
          echo "     (Settings → Secrets and variables → Actions → update the relevant secret)"
          echo "  3. Confirm no alerts are firing in Grafana / Prometheus."
          echo "  4. Record the rotation in docs/secret-rotation-schedule.md if needed."
          echo ""
          echo "  Refer to docs/secret-rotation-schedule.md for full procedure."
          echo ""
