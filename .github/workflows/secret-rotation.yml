name: Secret Rotation

# Manual trigger only — secret rotation is an intentional, operator-approved
# action, not an automated background task.
#
# How to trigger:
#   gh workflow run secret-rotation.yml \
#     -f secret_type=jwt \
#     -f namespace=default \
#     -f deployment=backend \
#     -f dry_run=true
#
# SECURITY: This workflow MUST NOT echo, log, or persist any secret values.
# All credential material flows exclusively through masked secrets or
# kubectl/process stdin — never through environment variables that appear in
# workflow logs.
on:
  workflow_dispatch:
    inputs:
      secret_type:
        description: 'Which secret to rotate'
        required: true
        type: choice
        options:
          - jwt
          - webhook-encryption
          - signer-master
      namespace:
        description: 'Kubernetes namespace (default: default)'
        required: false
        default: 'default'
      deployment:
        description: 'Backend deployment name (default: backend)'
        required: false
        default: 'backend'
      dry_run:
        description: 'Dry run — validate without writing any changes'
        required: false
        type: boolean
        default: true

jobs:
  rotate:
    name: Rotate ${{ github.event.inputs.secret_type }} secret
    runs-on: ubuntu-latest
    environment: production  # Requires environment-level approval in GitHub

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          cd backend && npm ci --ignore-scripts

      # ── Pre-rotation health check ──────────────────────────────────────────
      # Record cluster health BEFORE any change so post-rotation comparison
      # is meaningful. Exit non-zero if the cluster is already degraded.
      - name: Pre-rotation health check
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "=== Pre-rotation pod status ==="
          kubectl get pods -n "${{ github.event.inputs.namespace }}" -l app=backend
          READY=$(kubectl get deployment "${{ github.event.inputs.deployment }}" \
            -n "${{ github.event.inputs.namespace }}" \
            -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          DESIRED=$(kubectl get deployment "${{ github.event.inputs.deployment }}" \
            -n "${{ github.event.inputs.namespace }}" \
            -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
          echo "Ready: $READY / $DESIRED"
          if [ "$READY" != "$DESIRED" ] || [ "$DESIRED" = "0" ]; then
            echo "ERROR: deployment is not fully ready before rotation. Aborting."
            exit 1
          fi
          rm -f /tmp/kubeconfig

      # ── JWT rotation ──────────────────────────────────────────────────────
      # Generates a new 48-byte base64 secret, patches the k8s Secret, then
      # rolls the deployment. All session tokens are immediately invalidated —
      # this is the intended behaviour during a rotation triggered by suspected
      # compromise or scheduled credential cycling.
      #
      # The script itself never logs the secret value. We do not set the new
      # JWT_SECRET as an environment variable in this step.
      - name: Rotate JWT secret
        if: github.event.inputs.secret_type == 'jwt'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          ARGS="--confirm \
            --secret-name stellaredupay \
            --deployment ${{ github.event.inputs.deployment }} \
            --namespace ${{ github.event.inputs.namespace }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would run: node scripts/rotate-jwt-secret.js $ARGS"
            echo "JWT rotation dry-run complete. Re-run with dry_run=false to apply."
          else
            node scripts/rotate-jwt-secret.js $ARGS
          fi
          rm -f /tmp/kubeconfig

      # ── Webhook encryption key rotation ─────────────────────────────────────
      # Relies on the dual-key grace period in webhookSecretEncryption.js:
      # sets WEBHOOK_SECRET_ENCRYPTION_KEY_PREVIOUS (current) and
      # WEBHOOK_SECRET_ENCRYPTION_KEY (new), re-encrypts all school records,
      # then the operator drops PREVIOUS after re-deploying.
      #
      # Secret values come from GitHub Secrets — never from inline env blocks
      # that would appear in job logs.
      - name: Rotate webhook encryption key
        if: github.event.inputs.secret_type == 'webhook-encryption'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          WEBHOOK_SECRET_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.WEBHOOK_SECRET_ENCRYPTION_KEY }}
          WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_SECRET_ENCRYPTION_KEY_NEW }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running dry-run (no writes)..."
            node scripts/rotate-webhook-encryption-key.js
          else
            echo "Applying rotation (writing re-encrypted records)..."
            node scripts/rotate-webhook-encryption-key.js --apply
            echo ""
            echo "Next steps:"
            echo "  1. Update WEBHOOK_SECRET_ENCRYPTION_KEY in k8s Secret to the new value."
            echo "  2. Redeploy the backend."
            echo "  3. After redeploy succeeds, drop WEBHOOK_SECRET_ENCRYPTION_KEY_PREVIOUS."
            echo "  4. Record rotation in incident/change-management log."
          fi

      # ── Signer master key rotation ────────────────────────────────────────
      # Re-encrypts all School.encryptedSigningKey records under the new key.
      # Old key (SIGNER_MASTER_KEY_OLD) must still be in the k8s Secret until
      # all records have been migrated and the deployment has restarted.
      - name: Rotate signer master key
        if: github.event.inputs.secret_type == 'signer-master'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SIGNER_MASTER_KEY_OLD: ${{ secrets.SIGNER_MASTER_KEY }}
          SIGNER_MASTER_KEY: ${{ secrets.SIGNER_MASTER_KEY_NEW }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running dry-run (no writes)..."
            node scripts/rotate-signer-master-key.js
          else
            echo "Applying rotation (writing re-encrypted records)..."
            node scripts/rotate-signer-master-key.js --apply
            echo ""
            echo "Next steps:"
            echo "  1. Update SIGNER_MASTER_KEY in k8s Secret to the new value."
            echo "  2. Drop SIGNER_MASTER_KEY_OLD from the Secret."
            echo "  3. Redeploy the backend."
            echo "  4. Verify a test decrypt/sign succeeds."
            echo "  5. Record rotation in incident/change-management log."
          fi

      # ── Post-rotation verification ────────────────────────────────────────
      # Confirm the deployment rolls out successfully and /health returns ok.
      # Only runs when NOT in dry-run mode and secret type is jwt (other types
      # require a manual redeploy step before the cluster is fully rotated).
      - name: Post-rotation rollout verification
        if: >
          github.event.inputs.secret_type == 'jwt' &&
          github.event.inputs.dry_run == 'false'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          echo "Waiting for rollout to complete..."
          kubectl rollout status \
            deployment/"${{ github.event.inputs.deployment }}" \
            -n "${{ github.event.inputs.namespace }}" \
            --timeout=300s

          echo "=== Post-rotation pod status ==="
          kubectl get pods -n "${{ github.event.inputs.namespace }}" -l app=backend

          echo ""
          echo "=== Rotation audit record ==="
          echo "Secret type : jwt"
          echo "Operator    : ${{ github.actor }}"
          echo "Run         : ${{ github.run_id }}"
          echo "Timestamp   : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Namespace   : ${{ github.event.inputs.namespace }}"
          echo "Deployment  : ${{ github.event.inputs.deployment }}"
          echo ""
          echo "Record this output in your incident or change-management log."
          rm -f /tmp/kubeconfig
