groups:
  - name: admin-alerts
    rules:
      - alert: AdminAlertFired
        expr: increase(send_admin_alert_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Admin alert fired
          runbook_url: "https://github.com/onlyonee1/PaymentFlow/blob/main/docs/observability.md#admin-alerts"
