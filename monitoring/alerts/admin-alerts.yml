groups:
  - name: admin-alerts
    rules:
      - alert: AdminAlertFired
        expr: increase(send_admin_alert_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Admin alert fired
          description: >
            An admin alert has been triggered (send_admin_alert_total has
            increased in the last 5 minutes). Check application logs for
            the alert details.
